<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MultiCraft · M1 双会话测试</title>
<style>body{margin:0;background:#101713;color:#d7e8dd;font:16px system-ui,sans-serif}main{max-width:1800px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 12px}p{line-height:1.6}a{color:#aad1b1}button,input{font:inherit;color:inherit;background:#203329;border:1px solid #62826b;border-radius:5px;padding:8px 12px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.sessions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}article{border:1px solid #405748;border-radius:10px;padding:14px;min-width:0}h2{font-size:18px}.tools{display:flex;flex-wrap:wrap;gap:8px}canvas{display:block;width:100%;aspect-ratio:16/9;background:#000;margin:14px 0;outline:none;touch-action:none}canvas:focus{outline:2px solid #aad1b1}.status{font-size:14px;min-height:22px;color:#abc3b2}.error{color:#ffc1a8}.chat{display:flex;gap:8px;margin-top:10px}.chat input{min-width:0;flex:1}#login[hidden],#workbench[hidden]{display:none}@media(max-width:1000px){.sessions{grid-template-columns:1fr}}</style></head>
<body><main><h1>MultiCraft · M1 同进程双会话测试</h1><p>此控制台仅供 asta OP 验证两个原版玩家会话。GPU 资源共享和音频隔离仍需分别验收。</p>
<div id="login"><p>请先在 <a href="/" target="_blank" rel="noopener">M0 页面</a>登录 asta OP，再回到这里。</p><button id="retry">检查登录</button></div>
<p id="message" role="status"></p><div id="workbench" hidden><p id="host-status"></p><p>点击各自画面操作。F9 打开或关闭游戏菜单，F8 释放鼠标。菜单使用普通指针；返回游戏后可点击“捕获鼠标”。</p><div class="sessions" id="sessions"></div></div>
</main><script type="module" src="/m1-app.js"></script></body></html>
